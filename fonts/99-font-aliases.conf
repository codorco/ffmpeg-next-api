<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Arial → FreeSans (same style, similar metrics) -->
  <alias>
    <family>Arial</family>
    <prefer><family>FreeSans</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>FreeSerif</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>FreeMono</family></prefer>
  </alias>

  <!-- Explicit font directory scan -->
  <dir>/usr/share/fonts/custom</dir>
  <dir>/usr/share/fonts/TTF</dir>
</fontconfig>
