services:
  ffmpeg-api:
    build: .
    container_name: ffmpeg-api
    restart: unless-stopped
    ports:
      - "9025:3000"
    environment:
      # Max upload size for multipart/base64/url sources across all endpoints
      # (single source of truth: src/constants.js). Raised from the app's
      # built-in default of 512MiB (536870912) to 1GiB.
      - FILE_SIZE_LIMIT_BYTES=1073741824
    volumes:
      - ./uploads:/home/ffmpgapi/uploads
    networks:
      - automacao_network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  automacao_network:
    external: true